// The DrawPetsNearby Godot Android plugin (phone-to-phone pet swapping over Google Nearby
// Connections). Build: see .ai/android.md. The AARs land in addons/drawpets_nearby/bin/.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "drawpets_nearby"
include ":plugin"
